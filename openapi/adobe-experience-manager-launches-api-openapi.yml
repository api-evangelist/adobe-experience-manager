openapi: 3.2.0
info:
  title: Adobe Experience Manager Launches API
  version: '1.0'
  description: Adobe Experience Manager (AEM) as a Cloud Service exposes REST APIs and GraphQL endpoints for content delivery, authoring, asset management, and infrastructure operations.
  contact:
    name: Adobe Developer
    url: https://developer.adobe.com/experience-cloud/experience-manager-apis/
servers:
- url: https://{author-instance}.adobeaemcloud.com
  description: AEM as a Cloud Service author tier (host varies per program/environment)
  variables:
    author-instance:
      default: author-p00000-e000000
      description: Customer-specific AEM author host
tags:
- name: Launches
  description: AEM Launches for Content Fragments (experimental)
paths:
  /:
    get:
      tags:
      - Launches
      summary: List launches for content fragments
      operationId: getRoot
      x-operation-id-source: derived
    post:
      tags:
      - Launches
      summary: Create a new launch
      operationId: postRoot
      x-operation-id-source: derived
  /{launchId}:
    get:
      tags:
      - Launches
      summary: Retrieve a launch by id
      parameters:
      - name: launchId
        in: path
        required: true
        schema:
          type: string
      operationId: getByLaunchId
      x-operation-id-source: derived
    put:
      tags:
      - Launches
      summary: Update a launch
      parameters:
      - name: launchId
        in: path
        required: true
        schema:
          type: string
      operationId: putByLaunchId
      x-operation-id-source: derived
    delete:
      tags:
      - Launches
      summary: Delete a launch
      parameters:
      - name: launchId
        in: path
        required: true
        schema:
          type: string
      operationId: deleteByLaunchId
      x-operation-id-source: derived
  /{launchId}/sources:
    get:
      tags:
      - Launches
      summary: List sources attached to a launch
      parameters:
      - name: launchId
        in: path
        required: true
        schema:
          type: string
      operationId: getByLaunchIdSources
      x-operation-id-source: derived
    post:
      tags:
      - Launches
      summary: Add a source to a launch
      parameters:
      - name: launchId
        in: path
        required: true
        schema:
          type: string
      operationId: postByLaunchIdSources
      x-operation-id-source: derived
  /{launchId}/rebase:
    post:
      tags:
      - Launches
      summary: Rebase a launch onto current production content
      parameters:
      - name: launchId
        in: path
        required: true
        schema:
          type: string
      operationId: postByLaunchIdRebase
      x-operation-id-source: derived
  /{launchId}/promote:
    post:
      tags:
      - Launches
      summary: Promote a launch (publish its content)
      parameters:
      - name: launchId
        in: path
        required: true
        schema:
          type: string
      operationId: postByLaunchIdPromote
      x-operation-id-source: derived
  /{launchId}/diff:
    post:
      tags:
      - Launches
      summary: Compute diff between a launch and its source
      parameters:
      - name: launchId
        in: path
        required: true
        schema:
          type: string
      operationId: postByLaunchIdDiff
      x-operation-id-source: derived
  /{launchId}/content:
    get:
      tags:
      - Launches
      summary: Retrieve content contained in a launch
      parameters:
      - name: launchId
        in: path
        required: true
        schema:
          type: string
      operationId: getByLaunchIdContent
      x-operation-id-source: derived
  /jobs:
    get:
      tags:
      - Launches
      summary: List asynchronous launch jobs
      operationId: getJobs
      x-operation-id-source: derived
  /jobs/{jobId}/status:
    get:
      tags:
      - Launches
      summary: Get status of an asynchronous launch job
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
      operationId: getJobsByJobIdStatus
      x-operation-id-source: derived
  /jobs/{jobId}/result:
    get:
      tags:
      - Launches
      summary: Get the result of an asynchronous launch job
      parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
      operationId: getJobsByJobIdResult
      x-operation-id-source: derived
components:
  securitySchemes:
    adobeIMS:
      type: oauth2
      description: Adobe IMS OAuth 2.0 with Server-to-Server credentials issued from the Adobe Developer Console for an AEM as a Cloud Service project.
      flows:
        clientCredentials:
          tokenUrl: https://ims-na1.adobelogin.com/ims/token/v3
          scopes: {}
